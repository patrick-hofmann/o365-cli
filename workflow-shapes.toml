schema = "openape-shapes/v1"
[cli]
id = "o365-cli"
executable = "o365-cli"
audience = "shapes"
version = "workflow-2"

[[operation]]
id = "workflow.delta"
command = ["workflow", "delta"]
required_options = ["account", "folder"]
display = "Read {folder} changes for {account}"
action = "read"
risk = "low"
resource_chain = ["mail-account:email={account}", "mail-folder:id={folder}", "mail-operation:name=delta"]

[[operation]]
id = "workflow.read"
command = ["workflow", "read"]
required_options = ["account", "message"]
display = "Read one immutable message for {account}"
action = "read"
risk = "low"
resource_chain = ["mail-account:email={account}", "mail-message:id={message}"]

[[operation]]
id = "workflow.label-snapshot"
command = ["workflow", "label-snapshot"]
required_options = ["account", "message"]
display = "Read complete label assessment for {account}"
action = "read"
risk = "low"
resource_chain = ["mail-account:email={account}", "mail-message:id={message}"]

[[operation]]
id = "workflow.thread-evidence"
command = ["workflow", "thread-evidence"]
required_options = ["account", "message"]
display = "Read same-account conversation evidence for {account}"
action = "read"
risk = "low"
resource_chain = ["mail-account:email={account}", "mail-message:id={message}"]

[[operation]]
id = "workflow.decide-label"
command = ["workflow", "decide-label"]
required_options = ["account", "request", "journal"]
display = "Apply one fresh label decision for {account}"
action = "categorize"
risk = "medium"
resource_chain = ["mail-account:email={account}", "mail-operation:name=decide-label"]

[[operation]]
id = "workflow.archive"
command = ["workflow", "archive"]
required_options = ["account", "message", "content-version", "sender", "subject", "source-folder", "destination", "operation", "journal"]
display = "Archive the exactly reviewed message for {account}"
action = "move"
risk = "high"
resource_chain = ["mail-account:email={account}", "mail-folder:id={source-folder}", "mail-message:id={message}", "mail-destination:id={destination}"]
