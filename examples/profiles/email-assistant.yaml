# Email & calendar assistant profile: can read mail/calendar, modify status, create drafts.
# Cannot send, delete, or create calendar events.
# Use enforce: true to prevent the agent from bypassing this profile.
description: "Email & calendar assistant with restricted access"
enforce: true
allow:
  - mail.read
  - mail.modify
  - drafts.create
  - drafts.list
  - folders.read
  - rules.read
  - calendar.read
  - calendar.respond
  - config.read
  - auth
